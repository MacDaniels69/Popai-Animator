<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Popai Animator</title>
<style>:root{
  --bg:#16181d; --bg2:#1d2026; --panel:#22262e; --panel2:#2a2f39; --line:#343a46; --line2:#424a59;
  --txt:#dfe3ea; --dim:#9099a8; --faint:#636c7b; --acc:#ff8a3d; --acc2:#ffb27a; --sel:#3d6fd6; --sel2:#2b4e97;
  --good:#5ccf8a; --bad:#ff5d5d; --key:#ffd166;
  font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif; font-size:12px; color:var(--txt);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:grid;grid-template-rows:34px 34px 1fr 4px var(--tlh,250px);height:100vh}
/* menubar */
#menubar{display:flex;align-items:center;gap:10px;background:#111318;border-bottom:1px solid var(--line);padding:0 8px;user-select:none}
.brand{font-size:13px;letter-spacing:.3px;white-space:nowrap;color:#fff}.brand b{color:var(--acc)}
.logo{color:var(--acc);margin-right:2px}
#menus{display:flex}
#menus>button{background:none;border:0;padding:6px 9px;border-radius:5px;cursor:default;color:#cfd5df}
#menus>button:hover,#menus>button.open{background:var(--panel2);color:#fff}
.mb-right{margin-left:auto;display:flex;align-items:center;gap:6px}
#docname{color:var(--dim);cursor:pointer;padding:4px 8px;border-radius:5px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#docname:hover{background:var(--panel2);color:#fff}
.search-btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;color:var(--dim);cursor:pointer}
.search-btn:hover{border-color:var(--acc);color:#fff}
kbd{font-family:ui-monospace,monospace;font-size:10px;background:var(--panel2);border:1px solid var(--line2);border-radius:3px;padding:0 4px;color:var(--dim)}
.ib{background:var(--panel);border:1px solid var(--line);border-radius:5px;min-width:26px;height:24px;cursor:pointer;color:#cfd5df;padding:0 6px}
.ib:hover{border-color:var(--line2);color:#fff;background:var(--panel2)}
.ib.sm{height:20px;min-width:22px;font-size:11px;padding:0 4px}
.ib.on,.toggle.on{background:var(--sel2);border-color:var(--sel);color:#fff}
.ib:disabled{opacity:.4;cursor:default}
/* tool options */
#toolopts{display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--bg2);border-bottom:1px solid var(--line);white-space:nowrap;overflow-x:auto;overflow-y:hidden}
#toolopts .tname{font-weight:600;color:#fff}
#toolopts .hint{color:var(--dim)}
#toolopts label{display:flex;align-items:center;gap:4px;color:var(--dim)}
#toolopts input[type=number]{width:52px}
#toolopts .sep{width:1px;height:18px;background:var(--line)}
input[type=number],input[type=text],select,textarea{background:#14161b;border:1px solid var(--line);border-radius:4px;padding:2px 5px;height:22px;outline:none}
textarea{height:auto;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
input[type=color]{width:26px;height:20px;border:1px solid var(--line2);border-radius:4px;padding:0;background:none;cursor:pointer}
input[type=checkbox]{accent-color:var(--acc)}
input[type=range]{accent-color:var(--acc)}
/* main */
#main{display:grid;grid-template-columns:46px 1fr var(--rw,330px);min-height:0}
#toolbar{background:var(--bg2);border-right:1px solid var(--line);overflow-y:auto;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:1px}
#toolbar .tg{font-size:8.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);margin:6px 0 2px}
#toolbar button{width:36px;height:30px;border:1px solid transparent;border-radius:6px;background:none;color:#c9cfd9;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}
#toolbar button:hover{background:var(--panel2)}
#toolbar button.on{background:var(--acc);color:#1b1206;border-color:var(--acc2)}
#toolbar button.na{opacity:.45}
#stagewrap{position:relative;min-width:0;min-height:0;background:#2b2e35;overflow:hidden}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
#stagehud{position:absolute;right:8px;bottom:8px;display:flex;gap:4px;align-items:center;background:rgba(17,19,24,.8);padding:3px 6px;border-radius:6px;border:1px solid var(--line)}
#hudInfo{color:var(--dim);margin-right:4px;font-variant-numeric:tabular-nums}
#dropHint{position:absolute;inset:16px;border:2px dashed var(--acc);border-radius:12px;display:none;align-items:center;justify-content:center;font-size:16px;color:#fff;background:rgba(0,0,0,.45);pointer-events:none}
#stagewrap.drag #dropHint{display:flex}
/* right */
#right{display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);min-height:0}
.panel{display:flex;flex-direction:column;min-height:0}
#layersPanel{height:var(--lyh,250px)}
#sidePanel{flex:1}
.ph{display:flex;align-items:center;justify-content:space-between;padding:4px 6px;background:var(--bg2);border-bottom:1px solid var(--line);font-weight:600}
.ph-btns{display:flex;gap:2px}
.hsplit{height:4px;background:var(--bg);cursor:row-resize;border-top:1px solid var(--line)}
.hsplit:hover{background:var(--acc)}
#layerTree{flex:1;overflow:auto;padding:2px 0}
.lrow{display:flex;align-items:center;height:24px;padding-right:4px;cursor:pointer;border-left:3px solid transparent;user-select:none}
.lrow:hover{background:var(--panel2)}
.lrow.sel{background:var(--sel2)}
.lrow.prim{background:var(--sel);}
.lrow .tw{width:14px;text-align:center;color:var(--dim);font-size:9px;flex:none}
.lrow .ic{width:20px;text-align:center;flex:none;font-size:12px}
.lrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .nm input{width:100%;height:18px}
.lrow .vb,.lrow .lb{width:20px;text-align:center;color:var(--dim);flex:none;font-size:11px}
.lrow .vb.off,.lrow .lb.off{opacity:.3}
.lrow .tag{font-size:9px;color:var(--acc2);margin-left:4px;flex:none}
.lrow.dropin{outline:1px dashed var(--acc)}
.lrow.dropabove{box-shadow:inset 0 2px 0 var(--acc)}
.lrow.dropbelow{box-shadow:inset 0 -2px 0 var(--acc)}
.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:6px 2px;color:var(--dim);cursor:pointer;white-space:nowrap}
.tabs button.on{color:#fff;border-bottom-color:var(--acc)}
#jobBadge{background:var(--acc);color:#000;border-radius:8px;padding:0 4px;font-size:9px}
#jobBadge:empty{display:none}
#tabBody{flex:1;overflow:auto;padding:6px 8px 20px}
/* inspector */
.sec{border:1px solid var(--line);border-radius:7px;margin-bottom:8px;background:var(--bg2)}
.sec>h4{margin:0;padding:5px 8px;font-size:11px;letter-spacing:.3px;color:#fff;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.sec>h4 .r{margin-left:auto;display:flex;gap:3px}
.sec .body{padding:5px 8px;display:grid;grid-template-columns:86px 1fr 22px;gap:4px 6px;align-items:center}
.sec .body.free{display:block}
.prow{display:contents}
.prow>.pl{color:var(--dim);cursor:ew-resize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none}
.prow>.pl.nodrag{cursor:default}
.prow>.pv{display:flex;gap:4px;align-items:center;min-width:0}
.prow>.pv input[type=number]{width:100%;min-width:0}
.prow>.pv input[type=text],.prow>.pv select{width:100%;min-width:0}
.kbtn{width:18px;height:18px;border:0;background:none;cursor:pointer;color:var(--faint);font-size:11px;padding:0}
.kbtn.anim{color:var(--key);opacity:.6}
.kbtn.here{color:var(--key);opacity:1}
.hl{background:rgba(255,138,61,.18);border-radius:3px}
.note{color:var(--dim);font-size:11px;line-height:1.45;margin:4px 0}
.note b{color:#fff}
.btnrow{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:5px;padding:3px 9px;cursor:pointer;color:#e7ebf1;height:24px}
.btn:hover{border-color:var(--acc);color:#fff}
.btn.pri{background:var(--acc);border-color:var(--acc2);color:#1b1206;font-weight:600}
.btn.pri:hover{background:var(--acc2)}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.insp-search{width:100%;margin-bottom:6px}
.fxitem{border:1px solid var(--line);border-radius:6px;margin:5px 0;background:var(--panel)}
.fxitem .fxh{display:flex;align-items:center;gap:4px;padding:3px 6px;border-bottom:1px solid var(--line)}
.fxitem .fxh b{flex:1}
.fxitem.off{opacity:.55}
.swatches{display:flex;flex-wrap:wrap;gap:4px}
.sw{width:20px;height:20px;border-radius:4px;border:1px solid rgba(255,255,255,.18);cursor:pointer}
.sw:hover{transform:scale(1.12)}
.swgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.swcard{border:1px solid var(--line2);border-radius:6px;padding:4px;text-align:center;cursor:pointer;background:var(--panel)}
.swcard canvas{width:100%;height:52px;background:#fff;border-radius:3px;display:block}
.swcard.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.swcard span{display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* AI */
.ai-log{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.ai-msg{border-radius:7px;padding:6px 8px;line-height:1.45}
.ai-msg.user{background:var(--sel2);align-self:flex-end;max-width:90%}
.ai-msg.bot{background:var(--panel2);border:1px solid var(--line)}
.ai-msg .cmds{margin:5px 0;padding:0;list-style:none;font-family:ui-monospace,monospace;font-size:10.5px}
.ai-msg .cmds li{padding:2px 4px;border-left:2px solid var(--acc);margin:2px 0;background:rgba(0,0,0,.2)}
.ai-msg .cmds li.err{border-color:var(--bad);color:#ffb3b3}
.ai-input{display:flex;flex-direction:column;gap:5px;position:sticky;bottom:-20px;background:var(--panel);padding:6px 0}
.ai-input textarea{width:100%;min-height:54px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);border-radius:10px;padding:1px 7px;color:var(--dim);font-size:10.5px}
.chip b{color:#fff}
.sugg{display:flex;flex-wrap:wrap;gap:4px}
.sugg button{background:none;border:1px dashed var(--line2);color:var(--dim);border-radius:10px;padding:1px 7px;cursor:pointer;font-size:10.5px}
.sugg button:hover{color:#fff;border-color:var(--acc)}
/* jobs */
.job{border:1px solid var(--line);border-radius:6px;padding:6px;margin-bottom:6px;background:var(--bg2)}
.job .bar{height:5px;background:#111;border-radius:3px;overflow:hidden;margin:4px 0}
.job .bar i{display:block;height:100%;background:var(--acc)}
.job.done .bar i{background:var(--good)}.job.failed .bar i,.job.cancelled .bar i{background:var(--bad)}
/* timeline */
#timeline{display:flex;flex-direction:column;background:var(--panel);min-height:0}
#tlbar{display:flex;align-items:center;gap:6px;padding:3px 8px;background:var(--bg2);border-bottom:1px solid var(--line);white-space:nowrap;overflow-x:auto;overflow-y:hidden;flex:none}
#tlbar .grp{display:flex;align-items:center;gap:3px}
#tlbar input[type=number]{width:54px}
#tlbar label{color:var(--dim);display:flex;align-items:center;gap:3px}
#tlwrap{flex:1;position:relative;min-height:0}
#tlcanvas{position:absolute;inset:0;width:100%;height:100%}
/* menus */
.dd{position:fixed;background:#1b1e24;border:1px solid var(--line2);border-radius:7px;padding:4px;min-width:220px;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:50;max-height:80vh;overflow-y:auto}
.dd .mi{display:flex;align-items:center;gap:10px;padding:5px 10px;border-radius:4px;cursor:pointer;white-space:nowrap}
.dd .mi:hover{background:var(--sel)}
.dd .mi.dis{opacity:.4;pointer-events:none}
.dd .mi .k{margin-left:auto;color:var(--faint);font-size:10.5px}
.dd .mi .tg{font-size:9px;color:var(--acc2);border:1px solid var(--acc2);border-radius:3px;padding:0 3px;opacity:.8}
.dd hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.dd .hd{padding:4px 10px 2px;font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.5px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(5,6,9,.66);display:none;align-items:center;justify-content:center;z-index:95}
#modal.show{display:flex}
.dlg{background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.6);min-width:380px;max-width:min(860px,94vw);max-height:90vh;display:flex;flex-direction:column}
.dlg>h3{margin:0;padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px;display:flex;align-items:center}
.dlg>h3 .x{margin-left:auto;cursor:pointer;color:var(--dim)}
.dlg>.db{padding:14px 16px;overflow:auto}
.dlg>.df{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:6px}
.form{display:grid;grid-template-columns:140px 1fr;gap:8px 10px;align-items:center}
.form label{color:var(--dim)}
.cmdp{width:min(620px,92vw)}
.cmdp input{width:100%;height:34px;font-size:14px}
.cmdlist{max-height:50vh;overflow:auto;margin-top:8px}
.cmdlist .ci{display:flex;gap:8px;padding:6px 8px;border-radius:5px;cursor:pointer;align-items:center}
.cmdlist .ci.on{background:var(--sel)}
.cmdlist .ci .m{color:var(--faint);font-size:10.5px;width:70px}
.cmdlist .ci .k{margin-left:auto;color:var(--faint)}
.cmdlist .ci.dis{opacity:.5}
.cmdlist .ci .why{color:var(--bad);font-size:10.5px}
/* home */
.dlg.home{width:min(820px,92vw)}
.homein .hero{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.homein .hero .big{font-size:26px;font-weight:700;color:#fff}.homein .hero .big b{color:var(--acc)}
.homein .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{border:1px solid var(--line2);border-radius:10px;padding:12px;background:var(--bg2);cursor:pointer}
.card:hover{border-color:var(--acc)}
.card h5{margin:0 0 4px;font-size:13px;color:#fff}
.card p{margin:0;color:var(--dim);line-height:1.4}
.toast{background:#0d0f13;border:1px solid var(--line2);border-radius:6px;padding:7px 12px;margin-top:6px;box-shadow:0 6px 20px rgba(0,0,0,.4);transition:opacity .4s}
.toast.err{border-color:var(--bad)} .toast.ok{border-color:var(--good)} .toast.out{opacity:0}
#toasts{position:fixed;left:60px;bottom:calc(var(--tlh,250px) + 16px);z-index:90;pointer-events:none}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#3a404c;border-radius:6px}::-webkit-scrollbar-track{background:transparent}

/* mode switch, breadcrumb, context chips */
.seg{display:flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.seg button{background:var(--panel);border:0;padding:3px 10px;color:var(--dim);cursor:pointer}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--sel);color:#fff}
body.setup .seg button[data-m=setup].on{background:var(--acc);color:#1b1206;font-weight:600}
body.setup #toolopts{box-shadow:inset 0 -2px 0 var(--acc)}
#crumbs{position:absolute;left:8px;top:8px;display:flex;flex-wrap:wrap;align-items:center;gap:3px;max-width:calc(100% - 16px);pointer-events:auto;font-size:11px}
#crumbs .cr{background:rgba(17,19,24,.82);border:1px solid var(--line);border-radius:5px;padding:2px 7px;cursor:pointer;color:#cfd5df;white-space:nowrap}
#crumbs .cr:hover{border-color:var(--acc)}
#crumbs .cr.on{border-color:var(--sel);color:#fff}
#crumbs .cr i{font-style:normal;color:var(--faint);font-size:10px}
#crumbs .cr.bone{cursor:default;border-color:#ff8a3d}
#crumbs .sepc{color:var(--faint)}
#crumbs .crwarn{background:rgba(255,93,93,.18);border:1px solid var(--bad);color:#ffc2c2;border-radius:5px;padding:2px 7px}
#crumbs .crmode{background:var(--acc);color:#1b1206;border-radius:5px;padding:2px 7px;font-weight:700;margin-left:4px}
#toolopts .chip{border:1px solid var(--line2);border-radius:10px;padding:1px 8px;color:var(--dim);white-space:nowrap}
#toolopts .chip b{color:#fff;font-weight:600}
#toolopts .chip.rig{border-color:#5ccf8a55;color:#bfe9cf}
#toolopts .chip.warn{border-color:var(--bad);color:#ffc2c2}
#toolopts .btn{height:22px;padding:1px 8px}
#toolopts select{height:22px}
#toolbar button.na{opacity:.32}
#toolbar button.na:hover{background:none}
.lrow .tp{font-size:9px;color:var(--faint);margin-left:5px;flex:none;text-transform:uppercase;letter-spacing:.3px}
.lrow .att{font-size:10px;color:#9fe0b9;margin-left:5px;flex:none;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .ab{width:18px;text-align:center;flex:none;color:var(--faint);cursor:pointer;font-size:11px}
.lrow .ab.act{color:var(--key)}
.lrow.alt-off .nm{opacity:.6}
.btree .bn{display:flex;align-items:center;gap:4px;padding:2px 4px;border-radius:4px;cursor:pointer}
.btree .bn:hover{background:var(--panel2)}
.btree .bn.on{background:var(--sel2);color:#fff}
.btree .bn i{font-style:normal;color:var(--faint);font-size:10px;margin-left:auto}
.mixed::placeholder{color:var(--acc2);font-style:italic}
.swcard .acts{display:flex;gap:3px;margin-top:4px}
.swcard .acts button{flex:1;font-size:10px;padding:1px 2px;height:20px}
.swcard.prev{border-color:#4dabf7;box-shadow:0 0 0 1px #4dabf7}

/* Moho-style 4-column tool grid */
#main{grid-template-columns:136px 1fr var(--rw,330px)}
#toolbar{display:grid;grid-template-columns:repeat(4,30px);gap:2px;align-content:start;justify-content:center;padding:4px 2px 10px}
#toolbar .tg{grid-column:1/-1;margin:6px 0 1px 2px;text-align:left}
#toolbar .tg.ctx{color:var(--acc2)}
#toolbar button{width:30px;height:28px;font-size:14px}
#toolbar button svg{width:20px;height:20px}
#toolbar button.on svg{color:#1b1206}
#toolopts .tname svg{width:16px;height:16px;vertical-align:-3px;margin-right:2px}
</style>
</head>
<body>
<div id="app">
  <header id="menubar">
    <div class="brand"><span class="logo">◆</span> Popai <b>Animator</b></div>
    <nav id="menus"></nav>
    <div class="mb-right">
      <div class="seg" id="modeSeg" title="Setup: build the rig and rest pose · Animate: record keys (Tab toggles)"><button data-m="setup">⚙ Setup</button><button data-m="animate">● Animate</button></div>
      <span id="docname" title="Project settings"></span>
      <button class="ib" id="btnUndo" title="Undo (Ctrl+Z)">↶</button>
      <button class="ib" id="btnRedo" title="Redo (Ctrl+Shift+Z)">↷</button>
      <button class="search-btn" id="btnCmd" title="Command search (Ctrl+K)">⌕ Search commands… <kbd>Ctrl K</kbd></button>
    </div>
  </header>
  <div id="toolopts"></div>
  <div id="main">
    <aside id="toolbar"></aside>
    <section id="stagewrap">
      <canvas id="stage"></canvas>
      <div id="crumbs"></div>
      <div id="stagehud">
        <span id="hudInfo"></span>
        <button class="ib sm" data-view="fit" title="Fit frame (Home)">⤢</button>
        <button class="ib sm" data-view="100" title="100%">1:1</button>
        <button class="ib sm toggle" data-view="output" title="Output only — hide editor overlays (O)">◉</button>
      </div>
      <div id="dropHint">Drop images, audio or a .popai.json project</div>
    </section>
    <aside id="right">
      <div id="layersPanel" class="panel">
        <div class="ph"><span>Layers</span>
          <div class="ph-btns">
            <button class="ib sm" id="lyAdd" title="New layer">＋</button>
            <button class="ib sm" id="lyDup" title="Duplicate layer (Ctrl+D)">⧉</button>
            <button class="ib sm" id="lyGroup" title="Group selected layers (Ctrl+G)">▣</button>
            <button class="ib sm" id="lyUp" title="Raise layer">▲</button>
            <button class="ib sm" id="lyDown" title="Lower layer">▼</button>
            <button class="ib sm" id="lyDel" title="Delete layer">🗑</button>
          </div>
        </div>
        <div id="layerTree"></div>
      </div>
      <div id="rsplit" class="hsplit"></div>
      <div id="sidePanel" class="panel">
        <div class="tabs" id="sideTabs">
          <button data-tab="props" class="on">Properties</button>
          <button data-tab="style">Style</button>
          <button data-tab="switch">Switch</button>
          <button data-tab="ai">AI ✦</button>
          <button data-tab="jobs">Jobs <span id="jobBadge"></span></button>
        </div>
        <div id="tabBody"></div>
      </div>
    </aside>
  </div>
  <div id="tsplit" class="hsplit"></div>

// --- Select / transform layer
defTool('select', {
  icon: '➤', name: 'Select / Transform layer', key: 'V', hint: 'Click to select · drag to move · handles scale/rotate · drag the ⊕ pivot to move it · Shift-click adds',
  down(e, sx, sy) {
    const sel = selLayer();
    if (sel && !sel.lock) {
      const lc0 = lcOf(sel), o = M.ap(lc0.full, sel.p.ox || 0, sel.p.oy || 0);
      if (Math.hypot(sx - o[0], sy - o[1]) < 8 * Stage.dpr) { beginEdit('Move pivot'); startDrag(e, { mode: 'pivot', L: sel, inv: M.inv(lc0.full) }); return; }
      const h = hitHandle(screenBBox(sel), sx, sy);
      if (h) { this.beginTf(e, sel, h.k === 'rot' ? 'rot' : 'scale', h.k); return; }
    }
    const hit = hitTestLayers(sx, sy);
    if (hit) {
      if (e.shiftKey) { S.selLayers = S.selLayers.includes(hit.L.id) ? S.selLayers.filter((i) => i !== hit.L.id) : [...S.selLayers, hit.L.id]; }
      else if (!S.selLayers.includes(hit.L.id)) S.selLayers = [hit.L.id];
      else S.selLayers = [...S.selLayers.filter((i) => i !== hit.L.id), hit.L.id];
      S.selShape = hit.shape ? hit.shape.id : null;
      refreshAll();
      this.beginTf(e, hit.L, 'move');
    } else if (sel && !e.shiftKey) {
      const bb = screenBBox(sel);
      if (sx >= bb[0] && sx <= bb[2] && sy >= bb[1] && sy <= bb[3]) { this.beginTf(e, sel, 'move'); return; }
      S.selLayers = []; S.selShape = null; refreshAll();
    }
  },
  beginTf(e, L, mode, handle) {
    const targets = mode === 'move' ? S.selLayers.map((id) => findLayer(id)).filter((l) => l && !l.lock) : [L];
    beginEdit(mode === 'move' ? 'Move layer' : mode === 'rot' ? 'Rotate layer' : 'Scale layer');
    const o = M.ap(lcOf(L).full, L.p.ox || 0, L.p.oy || 0);
    startDrag(e, { mode, handle, L, o, targets: targets.map((T) => ({ T, x: val(T, 'x', S.frame), y: val(T, 'y', S.frame), rot: val(T, 'rot', S.frame), sx: val(T, 'sx', S.frame), sy: val(T, 'sy', S.frame), inv: M.inv(parentFull(T)) })) });
  },
  move(e, sx, sy) {
    const d = Stage.drag; if (!d) return;
    const dx = sx - d.sx, dy = sy - d.sy;
    if (d.mode === 'pivot') { const q = M.ap(d.inv, sx, sy); d.L.p.ox = round(q[0]); d.L.p.oy = round(q[1]); requestDraw(); return; }
    if (d.mode === 'move') {
      for (const t of d.targets) { let v = M.apv(t.inv, dx, dy); if (e.shiftKey) { if (Math.abs(v[0]) > Math.abs(v[1])) v[1] = 0; else v[0] = 0; } setVal(t.T, 'x', round(t.x + v[0])); setVal(t.T, 'y', round(t.y + v[1])); }
    } else if (d.mode === 'rot') {
      const a0 = Math.atan2(d.sy - d.o[1], d.sx - d.o[0]), a1 = Math.atan2(sy - d.o[1], sx - d.o[0]);
      let r = d.targets[0].rot + (a1 - a0) / DEG; if (e.shiftKey) r = Math.round(r / 15) * 15;
      setVal(d.L, 'rot', round(r));
    } else {
      const t = d.targets[0], h = d.handle;
      const d0 = Math.hypot(d.sx - d.o[0], d.sy - d.o[1]) || 1, d1 = Math.hypot(sx - d.o[0], sy - d.o[1]);
      let k = d1 / d0;
      if (h === 'n' || h === 's') setVal(d.L, 'sy', round(t.sy * k, 3));
      else if (h === 'e' || h === 'w') setVal(d.L, 'sx', round(t.sx * k, 3));
      else { setVal(d.L, 'sx', round(t.sx * k, 3)); setVal(d.L, 'sy', round(t.sy * k, 3)); }
    }
    requestDraw();
  },
  up() { commitEdit(); },
});

// --- Points
defTool('points', {
  icon: '⬚', name: 'Select / Transform points', key: 'A', cursor: 'crosshair', hint: 'Click/drag points · marquee to select · Shift adds · handles scale/rotate · Del deletes · Ctrl+A selects all',
  down(e, sx, sy) {
    const L = selLayer();
    if (!L || L.type !== 'vector') { const hit = hitTestLayers(sx, sy); if (hit && hit.L.type === 'vector') { S.selLayers = [hit.L.id]; S.selPts.clear(); refreshAll(); } else toast('Select a vector layer to edit its points'); return; }
    if (L.lock) return toast('Layer is locked');
    if (S.selPts.size > 1) { const bb = ptsBBox(L, S.selPts); const h = bb && hitHandle(bb, sx, sy); if (h) return this.beginPts(e, L, h.k === 'rot' ? 'rot' : 'scale', bb); }
    const pid = hitPoint(L, sx, sy);
    if (pid) {
      if (e.shiftKey) { S.selPts.has(pid) ? S.selPts.delete(pid) : S.selPts.add(pid); }
      else if (!S.selPts.has(pid)) { S.selPts = new Set([pid]); }

    }
    const sh = hitLayerEntry(lcOf(L), sx, sy);
    if (sh && sh.shape && !e.shiftKey) {
      S.selShape = sh.shape.id; const ids = new Set(); sh.shape.paths.forEach((pid) => { const pa = L.paths.find((p) => p.id === pid); pa && pa.pts.forEach((i) => ids.add(i)); });
      S.selPts = ids; refreshAll(); this.beginPts(e, L, 'move'); return;
    }
    if (!e.shiftKey) S.selPts = new Set();
    startDrag(e, { mode: 'marquee', L, base: new Set(S.selPts) }); refreshAll();
  },
  beginPts(e, L, mode, bb) {
    beginEdit(mode === 'move' ? 'Move points' : mode === 'rot' ? 'Rotate points' : 'Scale points');
    const start = {}; for (const id of S.selPts) start[id] = val(L, 'pt:' + id, S.frame);
    let c = [0, 0]; const ids = [...S.selPts]; ids.forEach((id) => { c[0] += start[id][0] / ids.length; c[1] += start[id][1] / ids.length; });
    startDrag(e, { mode, L, start, c, inv: M.inv(lcOf(L).full), cs: M.ap(lcOf(L).full, c[0], c[1]) });
  },
  move(e, sx, sy) {
    const d = Stage.drag; if (!d) return;
    if (d.mode === 'marquee') {
      const r = [Math.min(d.sx, sx), Math.min(d.sy, sy), Math.max(d.sx, sx), Math.max(d.sy, sy)];
      Stage.preview = { type: 'marquee', r };
      const lc = lcOf(d.L); const s = new Set(d.base);
      for (const id in lc.P) { const p = M.ap(lc.full, lc.P[id][0], lc.P[id][1]); if (p[0] >= r[0] && p[0] <= r[2] && p[1] >= r[1] && p[1] <= r[3]) s.add(id); }
      S.selPts = s; requestDraw(); return;
    }
    const L = d.L;
    if (d.mode === 'move') {
      let v = M.apv(d.inv, sx - d.sx, sy - d.sy);
      if (e.shiftKey) { if (Math.abs(v[0]) > Math.abs(v[1])) v[1] = 0; else v[0] = 0; }
      for (const id in d.start) setVal(L, 'pt:' + id, [round(d.start[id][0] + v[0]), round(d.start[id][1] + v[1])]);
    } else if (d.mode === 'rot') {
      const a = Math.atan2(sy - d.cs[1], sx - d.cs[0]) - Math.atan2(d.sy - d.cs[1], d.sx - d.cs[0]);
      const m = M.chain(M.t(d.c[0], d.c[1]), M.r(a), M.t(-d.c[0], -d.c[1]));
      for (const id in d.start) { const p = M.ap(m, d.start[id][0], d.start[id][1]); setVal(L, 'pt:' + id, [round(p[0]), round(p[1])]); }
    } else {
      const k = Math.hypot(sx - d.cs[0], sy - d.cs[1]) / (Math.hypot(d.sx - d.cs[0], d.sy - d.cs[1]) || 1);
      for (const id in d.start) setVal(L, 'pt:' + id, [round(d.c[0] + (d.start[id][0] - d.c[0]) * k), round(d.c[1] + (d.start[id][1] - d.c[1]) * k)]);
    }

  },
  up() { const d = Stage.drag; Stage.preview = null; if (d && d.mode !== 'marquee') commitEdit(); refreshAll(); },
});

// --- Pen (add points / paths)
function finishPen(closeIt) {
  const P = Stage.pen; Stage.pen = null; if (!P) return;
  const L = findLayer(P.layer); if (!L) return;
  const path = L.paths.find((p) => p.id === P.path); if (!path) return;
  edit(closeIt ? 'Close path' : 'Finish path', () => {
    if (path.pts.length < 2) { L.paths = L.paths.filter((p) => p !== path); for (const id of path.pts) if (!L.paths.some((pa) => pa.pts.includes(id))) delete L.pts[id]; return; }
    if (closeIt) path.closed = true;
    if (!L.shapes.some((s) => s.paths.includes(path.id)) && (closeIt || S.newStyle.strokeOn)) {
      const sh = addShape(L, [path.id], S.newStyle, closeIt ? {} : { fillOn: false });
      S.selShape = sh.id;
    }
  });
}
defTool('pen', {
  icon: '✒', name: 'Pen — add points', key: 'P', cursor: 'crosshair', hint: 'Click to add points (drag to place) · click first point to close · click a segment to insert · Enter/Esc finishes',
  down(e, sx, sy) {
    const L = ensureVectorLayer(); if (L.lock) return toast('Layer is locked');
    beginEdit('Add point');
    const loc = toLocal(L, sx, sy);
    const hp = hitPoint(L, sx, sy);
    let P = Stage.pen && Stage.pen.layer === L.id ? Stage.pen : null;
    let path = P && L.paths.find((p) => p.id === P.path);
    if (path && hp && hp === path.pts[0] && path.pts.length > 2) { commitEdit(); finishPen(true); return; }
    if (!path) {
      if (hp) { // continue from an open endpoint, or branch from an existing point
        const pa = L.paths.find((p) => !p.closed && (p.pts[0] === hp || p.pts[p.pts.length - 1] === hp));
        if (pa) { if (pa.pts[0] === hp) pa.pts.reverse(); Stage.pen = { layer: L.id, path: pa.id }; commitEdit(); requestDraw(); return; }
        path = { id: uid('a'), pts: [hp], closed: false }; L.paths.push(path); Stage.pen = { layer: L.id, path: path.id };
        commitEdit(); requestDraw(); return;
      }
      const seg = hitSegment(L, sx, sy);
      if (seg) {
        const id = addPoint(L, round(loc[0]), round(loc[1]), 1);
        seg.path.pts.splice(seg.index + 1, 0, id); S.selPts = new Set([id]);
        startDrag(e, { mode: 'pt', L, id, inv: M.inv(lcOf(L).full), start: [loc[0], loc[1]] }); return;
      }
      path = { id: uid('a'), pts: [], closed: false }; L.paths.push(path); Stage.pen = { layer: L.id, path: path.id };
    }
    let id = hp;
    if (!id) id = addPoint(L, round(loc[0]), round(loc[1]), this.opts.smooth ? 1 : 0);
    path.pts.push(id); S.selPts = new Set([id]);
    if (hp && hp !== path.pts[0]) { commitEdit(); finishPen(false); return; } // welded to another point
    startDrag(e, { mode: 'pt', L, id, inv: M.inv(lcOf(L).full), start: [loc[0], loc[1]] });
    requestDraw();
  },
  move(e, sx, sy) {
    const d = Stage.drag; if (!d || d.mode !== 'pt') return requestDraw();
    const v = M.apv(d.inv, sx - d.sx, sy - d.sy); const p = d.L.pts[d.id];
    if (p) { p.x = round(d.start[0] + v[0]); p.y = round(d.start[1] + v[1]); }
    requestDraw();
  },
  up() { commitEdit(); },
  opts: { smooth: true },
});

// --- Freehand
defTool('freehand', {
  icon: '✍', name: 'Freehand', key: 'F', cursor: 'crosshair', hint: 'Drag to draw a stroke · end near the start to make a filled closed shape',
  down(e, sx, sy) { const L = ensureVectorLayer(); if (L.lock) return toast('Layer is locked'); startDrag(e, { L }); Stage.preview = { type: 'poly', pts: [[sx, sy]] }; refreshAll(); },
  move(e, sx, sy) { if (!Stage.drag || !Stage.preview) return; const pts = Stage.preview.pts, l = pts[pts.length - 1]; if (Math.hypot(sx - l[0], sy - l[1]) > 2) pts.push([sx, sy]); requestDraw(); },

// --- Primitive shapes
function primTool(id, icon, name, key, gen) {
  defTool(id, {
    icon, name, key, cursor: 'crosshair', hint: 'Drag to draw · Shift = equal proportions · Alt = from center',
    down(e, sx, sy) { const L = ensureVectorLayer(); if (L.lock) return toast('Layer is locked'); beginEdit(name); startDrag(e, { L, a: toLocal(L, sx, sy), inv: M.inv(lcOf(L).full) }); },
    move(e, sx, sy) {
      const d = Stage.drag; if (!d) return;
      const b = M.ap(d.inv, sx, sy); let a = d.a.slice(), w = b[0] - a[0], h = b[1] - a[1];
      if (e.shiftKey) { const m = Math.max(Math.abs(w), Math.abs(h)); w = Math.sign(w || 1) * m; h = Math.sign(h || 1) * m; }
      if (e.altKey) a = [a[0] - w, a[1] - h], (w *= 2), (h *= 2);
      if (Math.abs(w) < 2 && Math.abs(h) < 2) return;
      const L = d.L, geo = gen(a[0], a[1], w, h);
      if (!d.path) {
        const ids = geo.map((g) => addPoint(L, 0, 0, g[2]));
        d.path = { id: uid('a'), pts: ids, closed: true }; L.paths.push(d.path);
        S.selShape = addShape(L, [d.path.id]).id;
      }
      d.path.pts.forEach((pid, i) => { L.pts[pid].x = round(geo[i][0]); L.pts[pid].y = round(geo[i][1]); });
      requestDraw();
    },
    up() { commitEdit(); },
  });
}
primTool('rect', '▭', 'Rectangle', 'R', (x, y, w, h) => [[x, y, 0], [x + w, y, 0], [x + w, y + h, 0], [x, y + h, 0]]);
primTool('ellipse', '◯', 'Ellipse', 'E', (x, y, w, h) => {
  const cx = x + w / 2, cy = y + h / 2, out = [];
  for (let i = 0; i < 8; i++) { const a = (i / 8) * Math.PI * 2; out.push([cx + (Math.cos(a) * w) / 2, cy + (Math.sin(a) * h) / 2, 1.105]); }
  return out;
});
primTool('polygon', '⬠', 'Polygon / star', 'Y', (x, y, w, h) => {
  const n = clamp(S.polySides | 0, 3, 24), cx = x + w / 2, cy = y + h / 2, out = [], star = S.polyStar, m = star ? n * 2 : n;
  for (let i = 0; i < m; i++) { const a = (i / m) * Math.PI * 2 - Math.PI / 2, r = star && i % 2 ? 0.45 : 1; out.push([cx + (Math.cos(a) * w * r) / 2, cy + (Math.sin(a) * h * r) / 2, 0]); }

});

// --- Paint bucket
defTool('fill', {
  icon: '🪣', name: 'Paint bucket', key: 'B', cursor: 'cell', hint: 'Click inside a closed path to fill it with the current style · Shift = stroke color only · Alt = pick style (eyedropper)',
  down(e, sx, sy) {
    const hit = hitTestLayers(sx, sy);
    if (e.altKey) {
      if (hit && hit.shape) { const st = shapeStyle(hit.L, hit.shape, S.frame); Object.assign(S.newStyle, { fill: st.fill, stroke: st.stroke, width: st.width }); toast('Picked style'); refreshAll(); }
      return;
    }
    let L = selLayer(); if (!L || L.type !== 'vector') { if (hit && hit.L.type === 'vector') L = hit.L; else return toast('Select a vector layer'); }
    const e2 = lcOf(L); M.set(_hitCtx, e2.full);
    const cands = L.paths.filter((pa) => pa.closed).map((pa) => { const p = new Path2D(); tracePath(p, L, pa, e2.P); return { pa, p }; }).filter((c) => _hitCtx.isPointInPath(c.p, sx, sy));
    if (!cands.length) {
      if (hit && hit.L === L && hit.shape) return edit('Recolor shape', () => this.paint(L, hit.shape, e.shiftKey));
      return toast('No closed path here — close the path first (Pen: click its first point)', 'err');
    }
    const area = (pa) => { let a = 0; const ids = pa.pts; for (let i = 0; i < ids.length; i++) { const p = e2.P[ids[i]], q = e2.P[ids[(i + 1) % ids.length]]; a += p[0] * q[1] - q[0] * p[1]; } return Math.abs(a); };
    cands.sort((a, b) => area(a.pa) - area(b.pa));
    const pa = cands[0].pa;
    edit('Fill', () => {
      const sh = L.shapes.find((s) => s.paths.includes(pa.id));
      if (sh) this.paint(L, sh, e.shiftKey);
      else S.selShape = addShape(L, [pa.id], S.newStyle, { fillOn: true }).id;
    });
  },
  paint(L, sh, strokeOnly) {
    if (sh.styleId) sh.styleId = null;
    if (strokeOnly) { setVal(L, 'sh:' + sh.id + ':stroke', S.newStyle.stroke); sh.strokeOn = true; }
    else { setVal(L, 'sh:' + sh.id + ':fill', S.newStyle.fill); sh.fillOn = true; }
    S.selShape = sh.id;
  },
});

function solveIK(B, endId, target, f, chainLen = 3) {

    const on = !(hb.b.dyn && hb.b.dyn.on);
    edit(on ? 'Enable bone physics' : 'Disable bone physics', () => { hb.b.dyn = { spring: 60, damp: 11, inertia: 0.6, lockTip: false, ...(hb.b.dyn || {}), on }; });
    toast(on ? `Physics on for ${hb.b.name} — it now swings after its parent moves` : `Physics off for ${hb.b.name}`, 'ok');
  },
});
// 13. Force
defTool('force', {
  icon: BIC.force, name: 'Force (wind & gravity)', key: '', cursor: 'crosshair', hint: 'Drag on the stage to set wind direction and strength for bones with physics · gravity and turbulence are in the bar',
  down(e, sx, sy) { const B = activeBoneLayer(); beginEdit('Wind force'); startDrag(e, { B, k: M.scaleOf(lcOf(B).full) }); },
  move(e, sx, sy) {
    const d = Stage.drag; if (!d) return; const B = d.B; B.force = B.force || {};
    const dx = sx - d.sx, dy = sy - d.sy; B.force.windA = round(Math.atan2(dy, dx) / DEG); B.force.windS = round((Math.hypot(dx, dy) / d.k) * 1.5);
    Stage.forceArrow = [d.sx, d.sy, sx, sy]; requestDraw();
  },
  up() { Stage.forceArrow = null; commitEdit(); },
});

function autoBindPoints(L, B, ids, allowed) { // weighted binding by distance to bone segments (rest pose); allowed = bone ids that may participate
  const lc = evalLC(L, 0), rest = boneFrames(B, null);
  const segs = B.bones.filter((b) => !allowed || allowed.includes(b.id)).map((b) => ({ id: b.id, a: M.ap(rest[b.id].F, 0, 0), b: M.ap(rest[b.id].F, b.len, 0) }));
  if (!segs.length) return 0;
  let n = 0;
  for (const id of ids) {
    const pt = L.pts[id]; if (!pt) continue;
    const p = M.ap(lc.relPts, pt.x, pt.y);
    const ds = segs.map((s) => ({ id: s.id, d: distToSeg(p[0], p[1], s.a, s.b) })).sort((a, b) => a.d - b.d);
    const near = ds.slice(0, 2), d0 = near[0].d + 1;
    const ws = near.map((x) => [x.id, 1 / Math.pow(x.d + 1, 3)]).filter((w, i) => i === 0 || near[i].d < d0 * 2.2 + 25);
    const sum = ws.reduce((s, w) => s + w[1], 0);
    pt.b = ws.map(([bid, w]) => [bid, round(w / sum, 3)]); n++;
  }
  L.bindBone = null;
  return n;
}

function zoomAt(sx, sy, k) {
  const before = M.ap(M.inv(viewM()), sx, sy);
  S.view.zoom = clamp(S.view.zoom * k, 0.03, 40);
  const after = M.ap(viewM(), before[0], before[1]);
  S.view.panX -= (after[0] - sx) / Stage.dpr; S.view.panY -= (after[1] - sy) / Stage.dpr;
  requestDraw();
}
function fitView() {
  const r = Stage.cv.getBoundingClientRect();
  S.view.zoom = Math.min((r.width - 60) / S.doc.w, (r.height - 60) / S.doc.h); S.view.panX = 0; S.view.panY = 0; requestDraw();
}

// ---------- stage input ----------
function initStage() {
  Stage.cv = $('#stage'); Stage.ctx = Stage.cv.getContext('2d');
  UI.stage = renderStage;
  const pos = (e) => { const r = Stage.cv.getBoundingClientRect(); return [(e.clientX - r.left) * Stage.dpr, (e.clientY - r.top) * Stage.dpr]; };
  let panDrag = null;
  Stage.cv.addEventListener('pointerdown', (e) => {
    Stage.cv.setPointerCapture(e.pointerId);
    const [sx, sy] = (Stage.mouse = pos(e));
    if (e.button === 1 || Stage.space || (e.button === 0 && S.tool === 'pan')) { panDrag = { sx, sy, px: S.view.panX, py: S.view.panY }; Stage.cv.style.cursor = 'grabbing'; return; }
    if (e.button !== 0) return;
    if (S.playing) stopPlay();
    const why = toolAvail(S.tool); if (why) return toast(why, 'err');
    const t = TOOLS[S.tool];
    if (t && t.down) t.down(e, sx, sy);
  });
  Stage.cv.addEventListener('pointermove', (e) => {
    const [sx, sy] = (Stage.mouse = pos(e));
    if (panDrag) { S.view.panX = panDrag.px + (sx - panDrag.sx) / Stage.dpr; S.view.panY = panDrag.py + (sy - panDrag.sy) / Stage.dpr; requestDraw(); return; }
    const d = Stage.drag;
    if (d) { if (!d.moved && Math.hypot(sx - d.sx, sy - d.sy) > 2) d.moved = true; if (d.moved) TOOLS[S.tool].move(e, sx, sy); }
    else if (S.tool === 'pen' && Stage.pen) requestDraw();
  });
  const end = (e) => {
    if (panDrag) { panDrag = null; setCursor(); return; }
    const d = Stage.drag; if (!d) return;
    const t = TOOLS[S.tool]; if (t && t.up) t.up(e);
    Stage.drag = null; Stage.preview = null; requestDraw();
  };
  Stage.cv.addEventListener('pointerup', end);
  Stage.cv.addEventListener('pointercancel', end);
  Stage.cv.addEventListener('dblclick', (e) => {
    const [sx, sy] = pos(e); const t = TOOLS[S.tool];
    if (t && t.dbl) t.dbl(e, sx, sy);
    else if (S.tool === 'pen' && Stage.pen) finishPen(false);
    else if (S.tool === 'select') { const h = hitTestLayers(sx, sy); if (h && h.L.type === 'vector') setTool('points'); }
  });
  Stage.cv.addEventListener('wheel', (e) => {
    e.preventDefault(); const [sx, sy] = pos(e);
    if (e.ctrlKey || e.metaKey || !e.shiftKey) zoomAt(sx, sy, Math.exp(-e.deltaY * 0.0015));
    else { S.view.panX -= e.deltaY * 0.5; requestDraw(); }
  }, { passive: false });
  new ResizeObserver(() => requestDraw()).observe(Stage.cv);
  // toolbar
  const tb = $('#toolbar');
  for (const [g, ids] of TOOL_GROUPS) {
    const lab = document.createElement('div'); lab.className = 'tg'; lab.dataset.group = g; lab.textContent = g; tb.appendChild(lab);
    for (const id of ids) {
      const t = TOOLS[id], b = document.createElement('button');
      b.dataset.tool = id; b.innerHTML = t.icon; b.title = `${t.name} (${t.key})\n${t.hint}`;
      b.onclick = () => setTool(id); tb.appendChild(b);
    }
  }
  $$('#stagehud [data-view]').forEach((b) => (b.onclick = () => {
    const v = b.dataset.view;
    if (v === 'fit') fitView(); else if (v === '100') { S.view.zoom = 1; requestDraw(); }
    else { S.outputOnly = !S.outputOnly; b.classList.toggle('on', S.outputOnly); requestDraw(); }
  }));
}

// ---------- switch helpers (preview vs. edit vs. set active) ----------
function swShown(SW) { return S.swPreview[SW.id] || switchOverrides()[SW.id] || switchState(SW, S.frame).cur; }
function swPreviewStep(SW, d) {
  const n = SW.children.length; if (!n) return;
  const i = SW.children.findIndex((c) => c.id === swShown(SW));
  S.swPreview[SW.id] = SW.children[(i + d + n) % n].id; refreshAll();
}
function swSetActive(SW, id) {
  id = id || swShown(SW); const c = SW.children.find((x) => x.id === id); if (!c) return;
  edit('Set active: ' + c.name, () => setVal(SW, 'sw', id, S.frame, true));
  delete S.swPreview[SW.id]; toast(`“${c.name}” is active from frame ${S.frame}`, 'ok');
}
function contentBox(L, f = S.frame) { // bounds of a layer's artwork in its parent's space
  const pts = [];
  const gather = (A, m) => {
    if (A.type === 'vector') { const P = deformedPts(A, f, null); for (const k in P) pts.push(M.ap(m, P[k][0], P[k][1])); }
    if (A.type === 'image') for (const [x, y] of [[-1, -1], [1, 1]]) pts.push(M.ap(m, (x * A.iw) / 2, (y * A.ih) / 2));
    if (A.children) A.children.forEach((c) => gather(c, M.mul(m, layerLocalM(c, f))));
  };
  gather(L, layerLocalM(L, f));
  if (!pts.length) return null;
  const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
}
function alignAlternatives(SW) {
  edit('Align alternatives', () => {
    for (const c of SW.children) {
      const b = contentBox(c); if (!b) continue;
      const cx = round((b[0] + b[2]) / 2), cy = round((b[1] + b[3]) / 2);
      c.p.x -= cx; c.p.y -= cy;
      if (c.ch.x) c.ch.x.keys.forEach((k) => (k.v -= cx)); if (c.ch.y) c.ch.y.keys.forEach((k) => (k.v -= cy));
    }
  });
  toast('Every alternative is now centred on the switch’s registration point', 'ok');
}
function bindingInfo(L) {
  const B = boneLayerFor(L); if (!B) return null;
  if (L.bindBone) { const b = B.bones.find((x) => x.id === L.bindBone); return { B, mode: 'Attached', text: `Attached to: ${b ? b.name : '?'}` }; }
  if (L.type === 'vector') {
    const pts = Object.values(L.pts), bound = pts.filter((p) => p.b && p.b.length), wt = bound.filter((p) => p.b.length > 1);
    if (bound.length) return { B, mode: wt.length ? 'Weighted' : 'Points', text: `Binding: ${wt.length ? 'Weighted' : 'Points'} (${bound.length}/${pts.length} points)` };
  }
  if (L.type === 'bone') return { B, mode: 'Nested', text: 'Nested rig: moved by the parent only if attached; it deforms its own artwork' };
  if (L.type === 'vector' && !ancestors(L.id).some((a) => a !== B && a.bindBone && boneLayerFor(a) === B) && B.bones.some((b) => b.str > 0)) return { B, mode: 'Flexible', text: 'Binding: Flexible — bends with bones whose strength region covers it' };
  return { B, mode: 'None', text: 'Not bound — the skeleton does not move this layer yet' };
}

const Jobs = { list: [] };
function runJob(name, kind, fn) {

const VISEMES = ['rest', 'MBP', 'AI', 'E', 'O', 'U', 'FV', 'L', 'WQ', 'etc'];

async function download(blob, name) {
  // Hosted on claude.ai: saves go through the platform's downloads capability (viewer confirms each file)
  let dl = null;
  try { if (window.claude && window.claude.use) dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
  if (dl) {
    let fn = name;
    if (!/\.(gif|png|jpe?g|webp|mp4|webm|txt|json|md|csv|html|svg|pdf|zip)$/i.test(fn)) fn += '.txt';
    try {
      await dl.save({ filename: fn, data: blob });
      if (fn !== name) toast(`Saved as ${fn} — rename it to ${name} to use it`, 'ok');
    } catch (e) { if (e && e.code !== 'declined') toast('Could not save: ' + ((e && (e.message || e.code)) || e), 'err'); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

function menuItems(m) {
  const items = []; let lastGroup = null;
  for (const c of CMDS.filter((x) => x.menu === m)) {
    const g = c.id.split('.')[0]; if (lastGroup && g !== lastGroup) items.push({ sep: 1 }); lastGroup = g;
    items.push({ label: c.label, k: c.k, run: () => runCmd(c.id), dis: c.en });
  }
  if (m === 'Draw') items.unshift(...TOOL_GROUPS.slice(1, 3).flatMap(([, ids]) => ids).map((id) => ({ label: 'Tool: ' + TOOLS[id].name, k: TOOLS[id].key, run: () => setTool(id) })), { sep: 1 });
  if (m === 'Rig') items.unshift(...TOOL_GROUPS.find((g) => g[0] === 'Bone')[1].map((id) => ({ label: 'Tool: ' + TOOLS[id].name, k: TOOLS[id].key, run: () => setTool(id), dis: () => toolAvail(id) })), { sep: 1 });
  return items;
}
function initMenus() {
  const nav = $('#menus');
  for (const m of MENUS) {
    const b = document.createElement('button'); b.textContent = m;
    b.onclick = () => { const r = b.getBoundingClientRect(); if (b.classList.contains('open')) return closeMenus(); showMenu(r.left, r.bottom + 2, menuItems(m), b); };
    b.onmouseenter = () => { if ($('#menuLayer .dd') && !b.classList.contains('open')) b.click(); };

// ---------- command palette ----------
function commandPalette() {
  const all = [...CMDS.map((c) => ({ label: c.label, menu: c.menu, k: c.k, kw: c.kw || '', run: () => runCmd(c.id), en: c.en })),
    ...Object.values(TOOLS).map((t) => ({ label: 'Tool: ' + t.name, menu: 'Tools', k: t.key, kw: t.hint, run: () => setTool(t.id), en: () => toolAvail(t.id) }))];
  modal('⌕ Search commands', `<div class="cmdp"><input type="text" id="cpq" placeholder="Type an action — e.g. lip sync, glow, bone, mouth, export…" autocomplete="off"><div class="cmdlist" id="cpl"></div></div>`, []);
  const q = $('#cpq'), list = $('#cpl'); let idx = 0, shown = [];
  const draw = () => {
    const t = q.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
    shown = all.filter((c) => t.every((w) => (c.label + ' ' + c.menu + ' ' + c.kw).toLowerCase().includes(w))).slice(0, 60);
    idx = Math.min(idx, Math.max(0, shown.length - 1));
    list.innerHTML = shown.map((c, i) => { const why = c.en && c.en(); return `<div class="ci ${i === idx ? 'on' : ''} ${why ? 'dis' : ''}" data-i="${i}"><span class="m">${c.menu}</span><span>${esc(c.label)}</span>${why ? `<span class="why">— ${esc(why)}</span>` : ''}<span class="k">${c.k ? esc(c.k) : ''}</span></div>`; }).join('') || '<div class="note">No matching command.</div>';
    list.querySelectorAll('.ci').forEach((el) => (el.onclick = () => go(+el.dataset.i)));
  };
  const go = (i) => { const c = shown[i]; if (!c) return; closeModal(null); setTimeout(() => (c.en && c.en() ? toast(c.en(), 'err') : c.run()), 10); };
  q.oninput = () => { idx = 0; draw(); };
  q.onkeydown = (e) => { if (e.key === 'ArrowDown') { idx = Math.min(shown.length - 1, idx + 1); draw(); e.preventDefault(); } if (e.key === 'ArrowUp') { idx = Math.max(0, idx - 1); draw(); e.preventDefault(); } if (e.key === 'Enter') { e.preventDefault(); go(idx); } };
  draw(); setTimeout(() => q.focus(), 20);
}

function jumpKey(dir) {
  const L = S.camSel ? S.doc.camera : selLayer(); if (!L) return;
  const fs = [...new Set(Object.values(L.ch).flatMap((c) => c.keys.map((k) => k.f)))].sort((a, b) => a - b);

function rigTest() {
  const B = activeBoneLayer(); if (!B.bones.length) return toast('This rig has no bones', 'err');
  // non-destructive: preview a sequence of poses then restore the exact document
  const snap = snapshot(); let i = 0;
  const poses = [['Rest', 0], ['Bend +45°', 45], ['Bend −45°', -45], ['Extreme +90°', 90], ['Extreme −90°', -90]];
  toast('Rig test: previewing pose suite (document is restored afterwards)');
  const step = () => {
    restore(snap);
    if (i >= poses.length) { refreshAll(); toast('Rig test finished — check for tearing or stray points', 'ok'); return; }
    const Bc = findLayer(B.id), [name, d] = poses[i++];
    for (const b of Bc.bones) if (b.parent) baseSet(Bc, 'bone:' + b.id + ':a', b.a + d * 0.6), delete Bc.ch['bone:' + b.id + ':a'];
    toast('Pose: ' + name); renderStage(); setTimeout(step, 700);
  };
  step();
}

      <div class="card" data-h="guide"><h5>? Quick guide</h5><p>How drawing, rigging, keys and lip sync work here.</p></div>
    </div></div>`, [], 'home');
  $$('#modal [data-h]').forEach((c) => (c.onclick = async () => {
    const h = c.dataset.h; closeModal(null);
    if (h === 'new') { if (!(await newProjectDialog())) showHome(); }
    if (h === 'blank') startDoc(newDoc({ name: 'Untitled' }));
    if (h === 'demo') { startDoc(demoProject()); S.selLayers = [allLayers().find((l) => l.type === 'bone').id]; refreshAll(); toast('Demo loaded — press Space to play', 'ok'); }
    if (h === 'open') pickFile('.json,.popai', importFile);
    if (h === 'recover') recoverAutosave();
    if (h === 'guide') quickGuide();
  }));
}
function quickGuide() {
  modal('Quick guide', `<div class="note" style="max-width:640px">
  <b>1 · Draw.</b> Use Pen (P), Freehand (F), Rectangle (R), Ellipse (E) or Polygon (Y). Points live on vector layers; shapes give them fill and stroke. Points tool (A) edits them; Paint bucket (B) fills closed paths.<br><br>
  <b>2 · Animate.</b> Frame 0 is the setup pose. Go to another frame and change anything — Auto-key creates keys. Right-click keys to change interpolation; switch to Curves to shape them. Onion skins (Shift+O) show neighbours.<br><br>
  <b>3 · Rig.</b> Create a Bone Group and press <b>Tab</b> for Setup mode. Draw bones with Add bone (N) — the selected bone becomes the parent. Put artwork inside, then attach whole layers to a bone (L) or bind points with weights (Rig ▸ Bind points). Press Tab again for Animate and pose with Manipulate bones (M); IK pulls the parent chain. The toolbar only enables tools that fit the selected layer and mode — hover a dimmed tool to see why.<br><br>
  <b>4 · Talk.</b> Import a WAV/MP3, create a mouth set (AI ▸ Create starter mouth set) and run AI ▸ Auto lip sync. It listens to the sound, so Shona and English both work. Fix any frame from the Switch tab; export the result as a Moho .dat.<br><br>
  <b>5 · Effects & camera.</b> Each layer has an ordered effects stack. Particles (Q) make dust, fire, smoke, sparks, snow and rain. The Camera tool (K) tracks, zooms and rolls; Depth Z gives parallax.<br><br>
  <b>6 · AI.</b> In the AI tab, describe the change. You get a plan of validated commands first; Apply turns it into normal keys/effects that one Undo reverts.<br><br>
  <b>7 · Save & export.</b> Ctrl+S downloads a project file with all media. File ▸ Export renders PNG, PNG sequences or WebM video with audio.</div>`);
}
function shortcutsDialog() {
  const rows = [...Object.values(TOOLS).map((t) => [t.key, 'Tool: ' + t.name]), ...CMDS.filter((c) => c.k).map((c) => [c.k, c.label]), ['Space (hold)', 'Pan the stage'], ['Wheel / Ctrl+wheel', 'Zoom stage / timeline'], ['Shift+drag', 'Constrain / zoom camera'], ['1–9', 'Pick switch drawing (Switch tab)']];
  modal('Keyboard shortcuts', `<div class="form" style="grid-template-columns:150px 1fr;max-height:60vh;overflow:auto">${rows.map(([k, n]) => `<kbd>${esc(k)}</kbd><span>${esc(n)}</span>`).join('')}</div>`);
}

// ---------- keyboard ----------
function keyName(e) { let k = e.key.toLowerCase(); if (k === ' ') k = 'space'; return (e.ctrlKey || e.metaKey ? 'ctrl+' : '') + (e.shiftKey && (k.length > 1 || /^[a-z0-9<>]$/.test(k)) ? 'shift+' : '') + (e.altKey ? 'alt+' : '') + k; }
function initKeys() {
  document.addEventListener('keydown', (e) => {
    if ($('#modal').classList.contains('show')) return;
    const tag = document.activeElement.tagName;
    if (/INPUT|TEXTAREA|SELECT/.test(tag) && !(e.ctrlKey && /^[zsy]$/i.test(e.key))) return;
    const k = keyName(e);
    if (k === 'ctrl+k') { e.preventDefault(); return commandPalette(); }
    if (e.key === 'Tab' && !e.ctrlKey && !e.altKey) { e.preventDefault(); return setMode(S.mode === 'setup' ? 'animate' : 'setup'); }
    if (e.key === ' ') { e.preventDefault(); if (!e.repeat) { Stage.spaceT = performance.now(); Stage.space = true; setCursor(); } return; }
    if (e.key === 'Escape') { if (Stage.pen) finishPen(false); else runCmd('edit.deselect'); closeMenus(); return; }
    if (e.key === 'Enter' && Stage.pen) { finishPen(false); return; }
    if (k === 'shift+o') { e.preventDefault(); return runCmd('anim.onion'); }
    if (e.shiftKey && (e.key === '>' || e.key === '.')) { e.preventDefault(); return runCmd('anim.nextkey'); }
    if (e.shiftKey && (e.key === '<' || e.key === ',')) { e.preventDefault(); return runCmd('anim.prevkey'); }
    if (e.key === '?') return shortcutsDialog();
    // arrow nudge for selected layer/points with select/points tools
    if (/^arrow/.test(e.key.toLowerCase()) && !e.ctrlKey && (S.tool === 'select' || S.tool === 'points') && (S.selLayers.length || S.selPts.size) && (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.altKey)) {
      e.preventDefault(); const n = e.shiftKey ? 10 : 1, dx = e.key === 'ArrowLeft' ? -n : e.key === 'ArrowRight' ? n : 0, dy = e.key === 'ArrowUp' ? -n : e.key === 'ArrowDown' ? n : 0;
      const L = selLayer(); if (!L) return;
      if (S.tool === 'points' && S.selPts.size && L.type === 'vector') edit('Nudge points', () => { for (const id of S.selPts) { const v = val(L, 'pt:' + id, S.frame); setVal(L, 'pt:' + id, [v[0] + dx, v[1] + dy]); } });
      else edit('Nudge layer', () => { for (const id of S.selLayers) { const T = findLayer(id); setVal(T, 'x', val(T, 'x', S.frame) + dx); setVal(T, 'y', val(T, 'y', S.frame) + dy); } });
      return;
    }
    const c = CMDS.find((c) => c.keys && c.keys.split('|').includes(k));
    if (c) { e.preventDefault(); runCmd(c.id); return; }
    if (!e.ctrlKey && !e.metaKey && !e.altKey) {
      const t = Object.values(TOOLS).find((t) => t.key && t.key.toLowerCase() === e.key.toLowerCase());
      if (t) { e.preventDefault(); setTool(t.id); return; }
      if (e.key.toLowerCase() === 'f' && !t) fitView();
    }
  });
  document.addEventListener('keyup', (e) => {
    if (e.key === ' ' && Stage.space) {
      Stage.space = false; setCursor();
      if (performance.now() - Stage.spaceT < 220 && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && !$('#modal').classList.contains('show')) togglePlay();
    }
  });
}

// ---------- splitters & drag-drop ----------
function initSplitters() {
  const drag = (el, fn) => el.addEventListener('pointerdown', (e) => { el.setPointerCapture(e.pointerId); const mv = (ev) => fn(ev); el.addEventListener('pointermove', mv); el.addEventListener('pointerup', () => el.removeEventListener('pointermove', mv), { once: true }); });
  drag($('#tsplit'), (e) => { document.documentElement.style.setProperty('--tlh', clamp(innerHeight - e.clientY, 90, innerHeight - 200) + 'px'); requestDraw(); });
  drag($('#rsplit'), (e) => { const top = $('#right').getBoundingClientRect().top; document.documentElement.style.setProperty('--lyh', clamp(e.clientY - top, 80, 600) + 'px'); });
  const sw = $('#stagewrap');
  ['dragenter', 'dragover'].forEach((ev) => sw.addEventListener(ev, (e) => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { e.preventDefault(); sw.classList.add('drag'); } }));
  ['dragleave', 'drop'].forEach((ev) => sw.addEventListener(ev, () => sw.classList.remove('drag')));
  sw.addEventListener('drop', (e) => { e.preventDefault(); [...e.dataTransfer.files].forEach(importFile); });
}

// ---------- boot ----------
function boot() {
  S.doc = newDoc();
  initStage(); initTimeline(); initLayersPanel(); initSide(); initMenus(); initKeys(); initSplitters();
  UI.panels.push(renderLayers, renderSide, updateUndoButtons, updateToolbar, renderToolOpts);
  $$('#modeSeg button').forEach((b) => (b.onclick = () => setMode(b.dataset.m))); updateModeUI();
  setTool('select'); updateTitle(); fitView(); refreshAll();
  setInterval(autosave, 15000);
  window.addEventListener('beforeunload', (e) => { if (S.dirtyDoc) { autosave(); } });
  showHome();
}
function updateUndoButtons() { $('#btnUndo').disabled = !H.undo.length; $('#btnRedo').disabled = !H.redo.length; $('#btnUndo').title = H.undo.length ? 'Undo: ' + H.undo[H.undo.length - 1].label + ' (Ctrl+Z)' : 'Nothing to undo'; $('#btnRedo').title = H.redo.length ? 'Redo: ' + H.redo[H.redo.length - 1].label : 'Nothing to redo'; }
window.PopaiTest = { particleList, newDoc, mkLayer, mouthKit, applyParticlePreset, vShape, vEllipse, vRect, setKey, sortBones, autoBindPoints, fxDefaults, uid, layerLocalM, evalLC }; // read-only hooks for compatibility tests
window.PopaiApp = { boneScreen, simulateBones, boneFrames, setMode, toolAvail, swSetActive, switchState, contentBox, S, H, CMDS, runCmd, edit, setFrame, setTool, findLayer, allLayers, renderScene, parseAI, applyCmd, demoProject, startDoc, val, TL, Stage, loadProjectJSON, serialize, analyzeSpeech, Jobs, openLipSync };
boot();

})();</script>
