[package]
name = "popai-animator"
version = "0.2.0"
description = "Popai Animator desktop app"
edition = "2021"

# Separate workspace: building the desktop app needs the platform webview SDK.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
popai-core = { path = "../../crates/popai-core" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
