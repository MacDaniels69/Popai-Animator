[package]
name = "popai-thumbnails"
version = "1.0.0"
edition = "2021"
description = "Windows File Explorer thumbnails for .popai project files (shows the saved camera view)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
popai-format = { path = "../popai-format" }
png = "0.18"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
] }
