# Builds the Windows app on GitHub's Windows machines. Nothing to install on your PC.
# Every build is published on the repository's Releases page as "Popai Animator (latest build)":
#   https://github.com/MacDaniels69/Popai-Animator/releases/latest
# with the installer .exe and the portable .exe ready to download (no sign-in needed).
name: Build Windows app
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            ui/src-tauri -> target
      - name: Explorer thumbnail provider (.popai files)
        shell: pwsh
        run: |
          cargo test --release -p popai-format -p popai-thumbnails
          # static C runtime: Explorer can load the DLL on PCs without the Visual C++ runtime installed
          $env:RUSTFLAGS = "-C target-feature=+crt-static"
          cargo build --release -p popai-thumbnails
          if (-not (Test-Path target/release/popai_thumbnails.dll)) { throw "popai_thumbnails.dll was not built" }
      - name: Engine compatibility tests
        run: cargo test --release -p popai-core
      - name: Install interface packages
        working-directory: ui
        run: npm ci
      - name: Build the app and installers
        working-directory: ui
        run: npx tauri build
      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item ui/src-tauri/target/release/bundle/nsis/*.exe "out/Popai-Animator-Setup.exe"
          Copy-Item ui/src-tauri/target/release/popai-animator.exe "out/Popai-Animator-Portable.exe"
          Compress-Archive -Path out/Popai-Animator-Setup.exe, out/Popai-Animator-Portable.exe -DestinationPath out/Popai-Animator-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Popai-Animator-Windows
          path: out/
      - name: Publish as the latest release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "Built automatically from commit ${{ github.sha }} on $(Get-Date -Format 'yyyy-MM-dd HH:mm') UTC.`n`n- Popai-Animator-Setup.exe: installs the app (Start menu + desktop shortcut)`n- Popai-Animator-Portable.exe: runs without installing`n- Popai-Animator-Windows.zip: both, zipped`n`nIf Windows shows 'Windows protected your PC', click More info, then Run anyway."
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest out/Popai-Animator-Setup.exe out/Popai-Animator-Portable.exe out/Popai-Animator-Windows.zip --title "Popai Animator (latest build)" --notes $notes --latest
