# Builds the Windows app on GitHub's Windows machines. Nothing to install on your PC:
# open the repository on github.com → Actions → "Build Windows app" → the latest run → download
# "Popai-Animator-Windows" (installer .exe and the portable .exe).
name: Build Windows app
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            ui/src-tauri -> target
      - name: Engine compatibility tests
        run: cargo test --release -p popai-core
      - name: Install interface packages
        working-directory: ui
        run: npm ci
      - name: Build the app and installers
        working-directory: ui
        run: npx tauri build
      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item ui/src-tauri/target/release/bundle/nsis/*.exe out/
          Copy-Item ui/src-tauri/target/release/popai-animator.exe "out/Popai Animator (portable).exe"
      - uses: actions/upload-artifact@v4
        with:
          name: Popai-Animator-Windows
          path: out/
